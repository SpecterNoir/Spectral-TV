name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch bundled Binarygeek119 logos
        run: python3 scripts/fetch-binarygeek119-logos.py Jellyfin.Plugin.FinTV/Assets/logos/binarygeek119

      - name: Restore NuGet packages
        run: dotnet restore Jellyfin.Plugin.FinTV/Jellyfin.Plugin.FinTV.csproj

      - name: Update build.yaml logo artifacts
        run: python3 scripts/update-build-artifacts.py

      - name: Mark development build
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('build.yaml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          data['version'] = '0.0.3.0'
          data['owner'] = 'SpecterNoir'
          data['overview'] = 'Virtual TV channels with weighted programming, promos, bumpers, and IPTV streaming'
          data['description'] = (
              'Development build of the recovered FinTV Jellyfin 12 plugin. '
              'Adds continuous airtime-weighted channels, sequential series playback, '
              'individual episode programming, and a separate promo/bumper/station-ID pool.'
          )
          path.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding='utf-8')
          PY

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        id: jprm
        with:
          dotnet-target: net10.0

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.jprm.outputs.artifact }}
