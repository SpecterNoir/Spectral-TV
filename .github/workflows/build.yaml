name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - main
      - feature/weighted-channels
    paths-ignore:
      - '**/*.md'
      - 'manifest.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch bundled Binarygeek119 logos
        run: python3 scripts/fetch-binarygeek119-logos.py Jellyfin.Plugin.SpectralTV/Assets/logos/binarygeek119

      - name: Restore NuGet packages
        run: dotnet restore Jellyfin.Plugin.SpectralTV/Jellyfin.Plugin.SpectralTV.csproj

      - name: Update build.yaml logo artifacts
        run: python3 scripts/update-build-artifacts.py

      - name: Mark development build
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/weighted-channels'
        env:
          BUILD_VERSION: 0.0.3.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('build.yaml')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^version:\s*.*$', f'version: "{os.environ["BUILD_VERSION"]}"', text, count=1)
          text = re.sub(r'(?m)^owner:\s*.*$', 'owner: "SpecterNoir"', text, count=1)
          text = re.sub(
              r'(?m)^imageUrl:\s*.*$',
              'imageUrl: "https://raw.githubusercontent.com/SpecterNoir/Spectral-TV/main/logo.png"',
              text,
              count=1)
          text = re.sub(
              r'(?m)^overview:\s*.*$',
              'overview: "Always-on virtual TV channels for Jellyfin with weighted programming, promos, bumpers, and IPTV streaming"',
              text,
              count=1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        id: jprm
        with:
          dotnet-target: net10.0

      - name: Strip Windows native SQLite DLLs from beta package
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          artifact="${{ steps.jprm.outputs.artifact }}"
          artifact_abs=$(realpath "$artifact")
          tmpdir=$(mktemp -d)
          unzip -q "$artifact_abs" -d "$tmpdir"
          find "$tmpdir/runtimes" -type f -path '*/win-*/native/*.dll' -delete 2>/dev/null || true
          rm -f "$artifact_abs"
          (cd "$tmpdir" && zip -qr "$artifact_abs" .)
          rm -rf "$tmpdir"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.jprm.outputs.artifact }}

      - name: Publish rolling beta and Jellyfin manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="${{ steps.jprm.outputs.artifact }}"
          zipname=$(basename "$artifact")
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('build.yaml').read_text(encoding='utf-8')
          print(re.search(r'(?m)^version:\s*["\x27]?([^"\x27\n]+)', text).group(1).strip())
          PY
          )
          checksum=$(md5sum "$artifact" | awk '{print $1}')
          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          git tag -f beta "${GITHUB_SHA}"
          git push origin refs/tags/beta --force

          if gh release view beta >/dev/null 2>&1; then
            gh release view beta --json assets --jq '.assets[].name' | while read -r asset_name; do
              case "$asset_name" in
                *.zip) gh release delete-asset beta "$asset_name" -y ;;
              esac
            done
            gh release upload beta "$artifact"
            gh release edit beta \
              --title "Spectral TV Latest Beta" \
              --notes "Latest installable Jellyfin 12 beta of Spectral TV, built automatically from main." \
              --prerelease
          else
            gh release create beta "$artifact" \
              --title "Spectral TV Latest Beta" \
              --notes "Latest installable Jellyfin 12 beta of Spectral TV, built automatically from main." \
              --prerelease
          fi

          VERSION="$version" CHECKSUM="$checksum" TIMESTAMP="$timestamp" ZIPNAME="$zipname" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          version = os.environ['VERSION']
          checksum = os.environ['CHECKSUM']
          timestamp = os.environ['TIMESTAMP']
          zipname = os.environ['ZIPNAME']

          manifest = [{
              "guid": "8a3f6c2d-5b4e-4d9a-a721-3e6f8c1b2d47",
              "name": "Spectral TV",
              "description": "Build always-on virtual television channels from your Jellyfin library with weighted programming, sequential or random episode progression, promos, bumpers, commercials, station IDs, M3U streaming, and XMLTV guide data.",
              "overview": "Always-on virtual TV channels for Jellyfin",
              "owner": "SpecterNoir",
              "category": "LiveTV",
              "imageUrl": "https://raw.githubusercontent.com/SpecterNoir/Spectral-TV/main/logo.png",
              "versions": [{
                  "version": version,
                  "changelog": "Development beta for Jellyfin 12. Fixes Synology/Linux loading by excluding Windows native SQLite DLLs from the plugin package, plus weighted programming, filler pools, persistent playout, M3U/XMLTV Live TV integration, and dashboard controls.",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": f"https://github.com/{repo}/releases/download/beta/{zipname}",
                  "checksum": checksum,
                  "timestamp": timestamp
              }]
          }]
          Path('manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Jellyfin plugin manifest for ${version} [skip ci]"
            git push origin HEAD:main
          fi