overview: "Virtual live and on-demand TV channels for Jellyfin"
description: >
  Build automatic Jellyfin Live TV channels and resumable on-demand smart channels from
  shows, seasons, episodes, and movies. Choose balanced, weighted, random, block, alternating,
  shuffle, fixed-sequence, or custom-pattern programming; keep each show's episode progress
  independent; insert optional promos and bumpers; use ordinary Jellyfin clients through
  native Live TV and private per-user playlists; expose the actual enabled Spectral live channels
  as a Channels row that can be placed from Jellyfin's normal Home screen section settings through
  Spectral TV's own Jellyfin Web integration; and keep the Spectral M3U/XMLTV sources connected to
  Jellyfin Live TV automatically through Jellyfin's own local server API.
